name: stremini_chatbot
description: "A Flutter chatbot application for Stremini AI"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  cupertino_icons: ^1.0.2
  http: ^1.5.0
  flutter_overlay_window: ^0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_lint: ^3.0.3

flutter:
  uses-material-design: true

  # FIXED: Changed from lib/img/ to assets/
  assets:
    - assets/logo.jpg
    - assets/home_icon.png
    - assets/question_mark_icon.png
    - assets/settings_icon.png