name: stremniapp
description: "Stremini AI - Your Digital Bodyguard"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Networking
  http: ^1.2.1
  
  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cupertino_icons: ^1.0.6
  
  # Permissions
  permission_handler: ^11.3.1
  
  # Overlay window for floating bubble
  flutter_overlay_window: ^0.5.2
  
  # Screenshot capability
  screenshot: ^3.0.0
  
  # Image picker for content analyzer
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/icons/
