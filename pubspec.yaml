name: stremini_ai
description: AI-powered assistant with floating widget for Android
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP & API
  http: ^1.1.0
  
  # State Management
  provider: ^6.1.1
  
  # Floating Widget
  flutter_overlay_window: ^0.5.0
  
  # Voice Recognition
  speech_to_text: ^6.6.0
  
  # Permissions
  permission_handler: ^11.1.0
  
  # UI & Icons
  flutter_svg: ^2.0.9
  cupertino_icons: ^1.0.2
  
  # Animations
  animations: ^2.0.11
  
  # Date Formatting (NEW - Required for extensions)
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/icons/
    - assets/images/

  # Fonts (Optional - Add custom fonts if needed)
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: fonts/CustomFont-Regular.ttf
  #       - asset: fonts/CustomFont-Bold.ttf
  #         weight: 700
