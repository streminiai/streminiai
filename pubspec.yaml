name: stremini_ai
description: Stremini AI - Your intelligent mobile assistant
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  
  # Floating button & overlay (FIXED VERSION)
  flutter_floating: ^1.1.2 
  system_alert_window: ^2.0.0
  
  # HTTP & API
  http: ^1.2.0
  dio: ^5.4.0
  
  # State Management
  provider: ^6.1.1
  get: ^4.6.6
  
  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Permissions
  permission_handler: ^11.2.0
  
  # Speech to Text
  speech_to_text: ^6.6.0
  
  # Text to Speech
  flutter_tts: ^4.0.2
  
  # Clipboard
  clipboard: ^0.1.3
  
  # Background Service
  flutter_background_service: ^5.0.5
  
  # Keyboard
  flutter_keyboard_visibility: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/lottie/
    - assets/icons/
